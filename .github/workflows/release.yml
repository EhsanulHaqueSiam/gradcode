name: Release

# A version tag (vX.Y.Z, the version in package.json) builds every download and publishes them
# as this repo's release, where installed apps and `getmyprof update` find them. The steps,
# the secrets and what is skipped without them: docs/internals/release.md.
# A PR that changes the release build runs everything but publish, Windows' install tests included.
on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - apps/desktop/**
      - packaging/**
      - apps/server/src/cli.ts
      - apps/server/src/launch.ts
      - apps/server/src/agent/binary.ts

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GETMYPROF_RELEASES: ${{ github.repository }}

jobs:
  # Everything but the Mac and Windows apps builds here, on the cheap runner: the command line for
  # all six platforms (each with its own Node) and both Linux arches.
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag is package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(pnpm -s dist version)" = "$GITHUB_REF_NAME"
      - run: pnpm dist runtime
      - run: pnpm dist cli darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64 win32-arm64
      - run: pnpm dist desktop linux x64 arm64
      - run: pnpm dist npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-linux
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/release/*.tar.gz
            dist/release/*.AppImage
            dist/release/*.deb
            dist/release/latest-linux*.yml
      # The Windows job tests these on Windows before they ship.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-windows-cli
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/release/*-win32-*.zip
            dist/release/npm/*.tgz
      # The same web app, server and Electron main for the Windows app, so no step runs twice.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime
          if-no-files-found: error
          path: apps/desktop/dist

  mac:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist runtime
      # Signed and notarized with a Developer ID when the secrets exist, else ad-hoc.
      - name: pnpm dist desktop mac arm64 x64
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          fi
          [ -n "$CSC_LINK" ] || export CSC_IDENTITY_AUTO_DISCOVERY=false
          pnpm dist desktop mac arm64 x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-mac
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/*.blockmap
            dist/release/latest-mac.yml

  # The setup .exe and .msi, x64 only: Windows on Arm runs them emulated.
  # ponytail: an arm64 setup .exe means a second latest.yml feed, add it when someone asks.
  # Then every Windows download is installed and started here, since no one tests on Windows.
  windows:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: runtime
          path: apps/desktop/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets-windows-cli
          path: dist/release
      - run: pnpm dist desktop win x64

      # install.ps1 from a local mirror of the release, then the installed command: serve, the
      # Claude binary it fetches, the web app, stop.
      - name: Test the command line from install.ps1
        shell: pwsh
        env:
          GRADHUNT_DIR: ${{ runner.temp }}\none
        run: |
          $v = pnpm -s dist version
          $zip = "getmyprof-$v-win32-x64.zip"
          $mirror = "$env:RUNNER_TEMP\mirror\download\v$v"
          New-Item -ItemType Directory $mirror | Out-Null
          Copy-Item "dist/release/$zip" $mirror
          $sum = (Get-FileHash -Algorithm SHA256 "dist/release/$zip").Hash.ToLower()
          Set-Content "$mirror\SHA256SUMS" "$sum  $zip"
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', "$env:RUNNER_TEMP\mirror"
          Start-Sleep 3
          $env:GETMYPROF_RELEASE_URL = 'http://127.0.0.1:8765'
          $env:GETMYPROF_VERSION = $v
          $env:GETMYPROF_INSTALL_DIR = "$env:RUNNER_TEMP\gmp"
          ./packaging/install.ps1
          $env:GETMYPROF_HOME = "$env:RUNNER_TEMP\home-cli"
          $gmp = "$env:RUNNER_TEMP\gmp\bin\getmyprof.cmd"
          if ((& $gmp --version) -ne $v) { throw "getmyprof --version isn't $v" }
          & $gmp serve
          $health = Invoke-RestMethod http://127.0.0.1:4350/api/health
          $health | ConvertTo-Json
          if (-not $health.checks.claude) { throw 'no Claude binary after serve' }
          if ((Invoke-WebRequest http://127.0.0.1:4350/settings).Content -notmatch '<div id="root">') { throw 'no web app' }
          & $gmp stop

      - name: Test the npm package
        shell: pwsh
        env:
          GRADHUNT_DIR: ${{ runner.temp }}\none
        run: |
          npm install -g (Resolve-Path dist/release/npm/*.tgz)
          $env:GETMYPROF_HOME = "$env:RUNNER_TEMP\home-npm"
          getmyprof serve
          $health = Invoke-RestMethod http://127.0.0.1:4350/api/health
          if (-not $health.checks.claude) { throw "npm didn't bring claude.exe" }
          getmyprof stop

      - name: Test the .msi and the setup .exe
        shell: pwsh
        env:
          GRADHUNT_DIR: ${{ runner.temp }}\none
        run: |
          $v = pnpm -s dist version
          $msi = Resolve-Path "dist/release/getmyprof-$v-x64.msi"
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the .msi didn't install: $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the .msi didn't uninstall: $($p.ExitCode)" }
          $p = Start-Process "dist/release/getmyprof-$v-x64-setup.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "the setup .exe didn't install: $($p.ExitCode)" }
          # Where it went, from the uninstall entry Windows lists it under.
          $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object DisplayName -like 'getmyprof*' | Select-Object -First 1
          $entry | Format-List DisplayName, DisplayVersion, UninstallString
          $uninstaller = ([regex]'"([^"]+)"').Match("$($entry.UninstallString)").Groups[1].Value
          $dir = Split-Path $uninstaller
          Get-ChildItem $dir | Format-Table Name, Length
          # updates.ts reads this uninstaller beside the app as "this install updates itself".
          if ((Split-Path -Leaf $uninstaller) -ne 'Uninstall getmyprof.exe') { throw "the uninstaller is $uninstaller" }
          if (-not (Test-Path "$dir\getmyprof.exe")) { throw "no getmyprof.exe in $dir" }
          if ((Split-Path -Leaf $dir) -ne 'getmyprof') { throw "installed in $dir" }
          $env:GETMYPROF_HOME = "$env:RUNNER_TEMP\home-app"
          $app = Start-Process "$dir\getmyprof.exe" -PassThru
          for ($i = 0; $i -lt 90 -and -not (Test-Path "$env:GETMYPROF_HOME\server.json"); $i++) { Start-Sleep 1 }
          if (-not (Test-Path "$env:GETMYPROF_HOME\server.json")) {
            Get-Content "$env:GETMYPROF_HOME\server.log" -ErrorAction SilentlyContinue
            throw "the app's server didn't start"
          }
          $port = (Get-Content "$env:GETMYPROF_HOME\server.json" | ConvertFrom-Json).port
          Invoke-RestMethod "http://127.0.0.1:$port/api/health" | ConvertTo-Json
          Stop-Process -Id $app.Id

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-windows
          compression-level: 0
          if-no-files-found: error
          path: |
            dist/release/*-setup.exe
            dist/release/*-setup.exe.blockmap
            dist/release/*.msi
            dist/release/latest.yml

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: dist/release
          merge-multiple: true
      # The installers ride along: the one-line installs read them from releases/latest/download,
      # and `getmyprof update` checks them against SHA256SUMS.
      - run: cp packaging/install.sh packaging/install.ps1 dist/release/ && pnpm dist sums && pnpm dist manifests

      # gh uploads every asset to a draft and publishes it last, so no updater sees half a release.
      # The notes are the install link, then GitHub's list of the PRs merged since the last tag.
      # A rerun (say after adding NPM_TOKEN) leaves a published release alone and goes on.
      - name: Release
        run: |
          cd dist/release
          gh release view "$GITHUB_REF_NAME" --repo "$GETMYPROF_RELEASES" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --repo "$GETMYPROF_RELEASES" \
            --title "getmyprof ${GITHUB_REF_NAME#v}" \
            --notes "Install: https://github.com/$GETMYPROF_RELEASES#install" --generate-notes \
            ./*.tar.gz ./*.dmg ./*.zip ./*.blockmap ./*.AppImage ./*.deb ./*.exe ./*.msi ./latest*.yml \
            install.sh install.ps1 SHA256SUMS

      # A deploy key with write access on the tap repo, so this needs no personal token.
      - name: Homebrew tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          [ -n "$TAP_KEY" ] || { echo "No HOMEBREW_TAP_KEY: the cask is in this run's publish artifact."; exit 0; }
          install -Dm600 /dev/stdin ~/.ssh/tap <<<"$TAP_KEY"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          owner="${GETMYPROF_RELEASES%%/*}"
          git clone --depth 1 "git@github.com:$owner/homebrew-tap.git" "$RUNNER_TEMP/tap"
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cp dist/publish/getmyprof.rb "$RUNNER_TEMP/tap/Casks/getmyprof.rb"
          cd "$RUNNER_TEMP/tap"
          git add Casks/getmyprof.rb
          git diff --cached --quiet && exit 0
          git -c user.name="getmyprof release" -c user.email="EhsanulHaqueSiam@users.noreply.github.com" \
            commit -m "getmyprof ${GITHUB_REF_NAME#v}"
          git push origin HEAD

      - name: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NODE_AUTH_TOKEN" ] || { echo "No NPM_TOKEN: the package is in this run's publish artifact."; exit 0; }
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > "$RUNNER_TEMP/.npmrc"
          NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/.npmrc" npm publish dist/release/npm/*.tgz --access public

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publish
          path: |
            dist/publish
            dist/release/npm/*.tgz
